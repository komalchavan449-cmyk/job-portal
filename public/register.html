<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Job Portal</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #eff6ff;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0002;
    }

    h1 { text-align: center; color: #2563eb; }
    p { text-align: center; color: #64748b; }
    label { display: block; margin: 14px 0 6px; }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
    }

    input, select { border: 1px solid #cbd5e1; }

    button {
      margin-top: 22px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }
    #message { margin-top: 15px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>
    <p>Register for Job Portal</p>

    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName"
        type="text" required maxlength="100"
        placeholder="Enter your full name">

      <label for="email">Email Address</label>
      <input id="email" name="email"
        type="email" required
        placeholder="Enter your email">

      <label for="password">Password</label>
      <input id="password" name="password"
        type="password" required minlength="8"
        placeholder="Minimum 8 characters">

      <label for="role">Register As</label>
      <select id="role" name="role" required>
        <option value="">Select Role</option>
        <option value="candidate">Candidate</option>
        <option value="recruiter">Recruiter</option>
      </select>

      <button id="submitBtn" type="submit">Create Account</button>
      <p id="message" role="status"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Please wait...";

      const data = {
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        role: document.getElementById("role").value
      };

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        message.textContent = result.message ||
          (result.success ? "Registration successful!" : "Registration failed.");
        message.style.color = result.success ? "green" : "red";

        if (result.success) form.reset();
      } catch (error) {
        message.textContent = "Server connection failed.";
        message.style.color = "red";
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
