<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Job Portal</h1>
        <p>Login to your account</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="register-link">
            Don't have an account?
            <a href="/register.html">Register here</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    message.textContent =
                        data.message || "Login failed. Please try again.";
                    message.style.color = "red";
                    return;
                }

                if (!data.user || !data.user.id || !data.user.role) {
                    message.textContent =
                        "Login response is missing user information.";
                    message.style.color = "red";
                    return;
                }

                // Save logged-in user details for the dashboard
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                // Remove any previous saved user entry
                localStorage.removeItem("currentUser");

                message.textContent = data.message || "Login successful!";
                message.style.color = "green";

                // Redirect according to account role
                if (data.user.role === "candidate") {
                    window.location.href = "/candidate-dashboard.html";

                } else if (data.user.role === "recruiter") {
                    window.location.href = "/recruiter-dashboard.html";

                } else {
                    localStorage.removeItem("user");

                    message.textContent = "Unknown user role.";
                    message.style.color = "red";
                }

            } catch (error) {
                console.error("Login error:", error);

                message.textContent =
                    "Server connection failed. Please try again.";
                message.style.color = "red";

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
